name: Base (Ubuntu + Python)

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.10"
      run-tox:
        required: false
        type: boolean
        default: false
      run-system-tests:
        required: false
        type: boolean
        default: false
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Run tox
        if: ${{ inputs.run-tox }}
        run: |
          python -m pip install --upgrade pip
          pip install tox
          tox

      - name: Run system tests
        working-directory: src
        if: ${{ inputs.run-system-tests }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -v -s --platforms=web --headless